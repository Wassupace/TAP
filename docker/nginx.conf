events {
  worker_connections 1024;
}

http {
  server {
    listen 54321;

    # Route /rest/v1/* → PostgREST (strips the /rest/v1 prefix)
    location /rest/v1/ {
      proxy_pass http://rest:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Required for PostgREST to accept the JWT from the client
      proxy_set_header Authorization $http_authorization;
      proxy_pass_header Authorization;

      # CORS — allows the Vite dev server to call the API.
      # PostgREST sends its own Access-Control-Allow-Origin /
      # Access-Control-Expose-Headers on real (non-OPTIONS) responses; hide
      # those before adding ours, or browsers reject the duplicate values.
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Expose-Headers;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Prefer, Range, apikey, X-Client-Info, Accept-Profile, Content-Profile, X-Retry-Count" always;
      add_header Access-Control-Expose-Headers "Content-Range, Range-Unit, Content-Length" always;

      if ($request_method = OPTIONS) {
        return 204;
      }
    }

    # Health check
    location /health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
