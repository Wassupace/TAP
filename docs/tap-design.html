<!-- TAP — Talking About Practice · PWA Design Prototype v1 -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600&family=Archivo+Expanded:wght@600;700;800&display=swap');

  :root{
    --ink:#080A0F;        /* deepest backdrop */
    --court:#0E131C;      /* screen bg */
    --panel:#141B26;      /* card */
    --panel-2:#1B2431;    /* raised */
    --panel-3:#222D3C;    /* input / hover */
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.12);
    --chalk:#F3F6FC;      /* primary text */
    --dim:#93A1B5;        /* secondary */
    --faint:#5C6A7E;      /* tertiary */
    --orange:#FF5A1F;     /* primary accent — basketball leather */
    --orange-2:#FF7C40;
    --orange-soft:rgba(255,90,31,.14);
    --blue:#3B82F6;       /* Team A */
    --blue-soft:rgba(59,130,246,.16);
    --red:#EF4444;        /* Team B */
    --red-soft:rgba(239,68,68,.16);
    --green:#22C55E;
    --yellow:#EAB308;
    --redz:#EF4444;
    --grey-z:rgba(156,163,175,.20);
    --r-lg:26px; --r-md:18px; --r-sm:12px;
    --shadow:0 18px 50px -12px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Archivo',sans-serif;
    background:
      radial-gradient(120% 80% at 50% -10%, #16202E 0%, transparent 55%),
      radial-gradient(80% 60% at 85% 110%, rgba(255,90,31,.10) 0%, transparent 60%),
      var(--ink);
    color:var(--chalk);
    min-height:100vh;
    padding:30px 16px 70px;
    display:flex; flex-direction:column; align-items:center; gap:22px;
  }
  /* faint hardwood grain */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:repeating-linear-gradient(96deg, rgba(255,255,255,.018) 0 2px, transparent 2px 26px);
    mix-blend-mode:overlay;
  }

  /* ---------- header + navigator ---------- */
  .masthead{width:100%; max-width:920px; text-align:center;}
  .masthead .badge{
    display:inline-flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--orange-2); font-weight:700;
    border:1px solid rgba(255,90,31,.3); padding:6px 12px; border-radius:999px; background:var(--orange-soft);
  }
  .masthead h1{font-family:'Anton',sans-serif; font-weight:400; letter-spacing:.01em; font-size:30px; margin:14px 0 4px; text-transform:uppercase;}
  .masthead p{color:var(--dim); font-size:13px; margin:0; max-width:560px; margin-inline:auto; line-height:1.5;}

  .nav{
    width:100%; max-width:920px; display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px;
    scrollbar-width:none; justify-content:flex-start;
  }
  .nav::-webkit-scrollbar{display:none;}
  .nav button{
    flex:0 0 auto; font-family:'Archivo',sans-serif; font-weight:700; font-size:12px; letter-spacing:.02em;
    color:var(--dim); background:var(--panel); border:1px solid var(--line); padding:9px 14px; border-radius:999px;
    cursor:pointer; transition:.18s; white-space:nowrap;
  }
  .nav button:hover{color:var(--chalk); border-color:var(--line-2);}
  .nav button.on{color:#0c0c0c; background:var(--orange); border-color:var(--orange); box-shadow:0 6px 18px -6px rgba(255,90,31,.6);}

  /* ---------- device ---------- */
  .device{
    width:400px; height:858px; flex:0 0 auto; position:relative;
    background:#000; border-radius:54px; padding:11px;
    box-shadow:var(--shadow), inset 0 0 0 2px #2a2f37, 0 0 0 11px #0b0d11;
  }
  .screenwrap{
    position:absolute; inset:11px; border-radius:44px; overflow:hidden; background:var(--court);
  }
  .island{
    position:absolute; top:18px; left:50%; transform:translateX(-50%); width:118px; height:33px;
    background:#000; border-radius:20px; z-index:60;
  }
  .statusbar{
    position:absolute; top:0; left:0; right:0; height:54px; z-index:50;
    display:flex; align-items:center; justify-content:space-between; padding:18px 30px 0;
    font-size:14px; font-weight:700; color:var(--chalk); pointer-events:none;
  }
  .statusbar .ic{display:flex; gap:6px; align-items:center;}
  .homebar{
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:135px; height:5px;
    background:rgba(255,255,255,.5); border-radius:3px; z-index:60;
  }

  /* ---------- screens ---------- */
  .screen{position:absolute; inset:0; display:none; flex-direction:column;}
  .screen.active{display:flex;}
  .scroll{flex:1; overflow-y:auto; padding:64px 18px 30px; scrollbar-width:none;}
  .scroll::-webkit-scrollbar{display:none;}
  .scroll.flushbottom{padding-bottom:96px;}

  /* staggered reveal */
  .screen.active .stagger>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;}
  .screen.active .stagger>*:nth-child(1){animation-delay:.02s}
  .screen.active .stagger>*:nth-child(2){animation-delay:.07s}
  .screen.active .stagger>*:nth-child(3){animation-delay:.12s}
  .screen.active .stagger>*:nth-child(4){animation-delay:.17s}
  .screen.active .stagger>*:nth-child(5){animation-delay:.22s}
  .screen.active .stagger>*:nth-child(6){animation-delay:.27s}
  .screen.active .stagger>*:nth-child(7){animation-delay:.32s}
  @keyframes rise{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}

  /* ---------- shared components ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .topbar .ttl{font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:.02em; font-size:22px;}
  .iconbtn{
    width:42px; height:42px; border-radius:14px; display:grid; place-items:center;
    background:var(--panel); border:1px solid var(--line); color:var(--chalk); cursor:pointer; transition:.15s;
  }
  .iconbtn:hover{background:var(--panel-2);}
  .iconbtn svg{width:20px;height:20px;}
  .back{display:inline-flex;align-items:center;gap:7px;color:var(--dim);font-weight:700;font-size:13px;background:none;border:0;cursor:pointer;padding:0;}
  .back svg{width:18px;height:18px;}
  .back:hover{color:var(--chalk);}

  .eyebrow{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); font-weight:700; margin:0 0 10px;}

  .btn{
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    min-height:58px; border-radius:var(--r-md); font-family:'Archivo Expanded','Archivo',sans-serif;
    font-weight:800; font-size:16px; letter-spacing:.02em; text-transform:uppercase; cursor:pointer;
    border:0; transition:transform .12s, filter .15s; color:#0c0c0c;
  }
  .btn:active{transform:scale(.975);}
  .btn.primary{background:linear-gradient(180deg,var(--orange-2),var(--orange)); box-shadow:0 12px 28px -10px rgba(255,90,31,.7);}
  .btn.ghost{background:var(--panel-2); color:var(--chalk); border:1px solid var(--line-2);}
  .btn.huge{min-height:72px; font-size:18px; border-radius:22px;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md); padding:16px;}
  .card.raised{background:var(--panel-2);}

  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--dim);}
  .chip.on{background:var(--orange);color:#0c0c0c;border-color:var(--orange);}

  .avatar{
    width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
    font-family:'Anton',sans-serif;font-size:14px;color:#0c0c0c;letter-spacing:.02em;
  }
  .avatar.lg{width:62px;height:62px;font-size:22px;}

  /* progress bar */
  .stat{margin:13px 0;}
  .stat .row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  .stat .lab{font-weight:800;font-size:13px;letter-spacing:.04em;}
  .stat .goal{font-size:11px;color:var(--dim);font-weight:600;}
  .track{height:11px;border-radius:7px;background:var(--panel-3);overflow:hidden;position:relative;}
  .fill{height:100%;border-radius:7px;position:relative;}
  .fill.g{background:linear-gradient(90deg,#16a34a,var(--green));}
  .fill.y{background:linear-gradient(90deg,#ca8a04,var(--yellow));}
  .fill.r{background:linear-gradient(90deg,#dc2626,var(--red));}
  .goaltick{position:absolute;top:-3px;width:2px;height:17px;background:var(--chalk);opacity:.7;border-radius:2px;}

  /* feed */
  .feeditem{display:flex;gap:12px;align-items:center;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:9px;}
  .feeditem .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;}
  .feeditem .ico svg{width:19px;height:19px;}
  .feeditem .t{font-weight:700;font-size:14px;}
  .feeditem .s{font-size:12px;color:var(--dim);margin-top:2px;}
  .feeditem .time{margin-left:auto;font-size:11px;color:var(--faint);font-weight:600;font-variant-numeric:tabular-nums;}

  /* floating bar */
  .floatbar{position:absolute;left:14px;right:14px;bottom:18px;display:flex;gap:10px;z-index:40;}
  .floatbar .btn{flex:1;min-height:54px;font-size:14px;}

  .mono{font-variant-numeric:tabular-nums;}
  .num{font-family:'Anton',sans-serif;font-weight:400;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}

  .stepper{display:flex;align-items:center;justify-content:space-between;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:6px;}
  .stepper button{width:44px;height:44px;border-radius:10px;border:0;background:var(--panel-3);color:var(--chalk);font-size:22px;font-weight:800;cursor:pointer;}
  .stepper button:active{background:var(--orange);color:#0c0c0c;}
  .stepper .v{font-family:'Anton',sans-serif;font-size:24px;}

  .toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);background:rgba(34,197,94,.95);color:#06210f;font-weight:800;padding:16px 26px;border-radius:18px;z-index:80;opacity:0;pointer-events:none;text-transform:uppercase;letter-spacing:.05em;font-size:15px;box-shadow:0 16px 40px -10px rgba(34,197,94,.6);}
  .toast.show{animation:flash 1.1s ease both;}
  @keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.95)}}

  /* calendar */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal .dow{text-align:center;font-size:10px;color:var(--faint);font-weight:700;padding-bottom:6px;letter-spacing:.06em;}
  .cal .day{aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--panel);border:1px solid transparent;position:relative;color:var(--dim);cursor:pointer;}
  .cal .day.out{opacity:.3;}
  .cal .day.today{border-color:var(--orange);color:var(--chalk);}
  .cal .day .dot{width:5px;height:5px;border-radius:50%;background:var(--orange);position:absolute;bottom:7px;}
  .cal .day.sel{background:var(--orange);color:#0c0c0c;}
  .cal .day.sel .dot{background:#0c0c0c;}

  /* recap callout */
  .callout{display:flex;gap:13px;padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:10px;}
  .callout .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange-2);font-weight:700;margin-bottom:4px;}
  .callout .v{font-size:15px;font-weight:600;line-height:1.35;}
  .callout .em{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;background:var(--orange-soft);}
  .callout .em svg{width:21px;height:21px;color:var(--orange-2);}

  /* shot chart */
  .sc-overlay{position:absolute;inset:0;z-index:70;background:rgba(6,9,14,.82);backdrop-filter:blur(8px);display:none;flex-direction:column;padding:64px 14px 22px;}
  .sc-overlay.active{display:flex;animation:fade .25s ease both;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sc-tabs{display:flex;gap:7px;justify-content:center;margin:6px 0 12px;}
  .sc-tabs button{font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;letter-spacing:.04em;padding:9px 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);color:var(--dim);cursor:pointer;}
  .sc-tabs button.on{background:var(--orange);color:#0c0c0c;border-color:var(--orange);}
  .sc-stage{background:linear-gradient(180deg,#10202c,#0a141c);border:1px solid var(--line);border-radius:18px;padding:8px;}
  .sc-legend{display:flex;gap:14px;justify-content:center;margin-top:14px;font-size:11px;color:var(--dim);font-weight:600;}
  .sc-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;}

  /* drag-rank */
  .rank{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;}
  .rank .pos{font-family:'Anton',sans-serif;font-size:18px;width:26px;color:var(--orange-2);text-align:center;}
  .rank .handle{margin-left:auto;color:var(--faint);font-size:18px;letter-spacing:-3px;}

  /* style guide swatches */
  .swatch{height:58px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;font-size:10px;font-weight:700;}
  .typespec{border-bottom:1px solid var(--line);padding:14px 0;}
  .typespec small{color:var(--faint);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;}

  @media (max-width:460px){
    .device{width:100%;height:auto;aspect-ratio:400/858;padding:9px;border-radius:46px;}
    body{padding:16px 8px 50px;}
  }
</style>

<div class="masthead">
  <span class="badge">● PWA Design · v1</span>
  <h1>TAP — Talking About Practice</h1>
  <p>Court-ready logging for pickup basketball. A clickable visual design across the core flows — built for one-handed use, sweaty thumbs, and the 30-second break between games.</p>
</div>

<div class="nav" id="nav"></div>

<div class="device">
  <div class="island"></div>
  <div class="screenwrap" id="wrap">

    <!-- status bar (shared, rendered per screen via JS clone is overkill; one global) -->
    <div class="statusbar" id="statusbar">
      <span class="mono" id="clock">9:41</span>
      <span class="ic">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="1" width="3" height="11" rx="1" opacity=".4"/><rect x="15" y="1" width="3" height="11" rx="1" opacity=".4"/></svg>
        <svg width="22" height="12" viewBox="0 0 24 12" fill="none"><rect x="1" y="1" width="19" height="10" rx="3" stroke="currentColor" stroke-width="1.4"/><rect x="2.5" y="2.5" width="14" height="7" rx="1.5" fill="currentColor"/><rect x="21" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
      </span>
    </div>

    <!-- ============ SCREENS INJECTED BELOW ============ -->
    <div id="screens"></div>

    <div class="homebar"></div>
  </div>
</div>

<script>
/* ============================================================= *
 *  Sample data
 * ============================================================= */
const players = [
  {nick:'JC',    name:'Jordan C.',  c:'#FF5A1F'},
  {nick:'Marcus',name:'Marcus T.',  c:'#3B82F6'},
  {nick:'Dre',   name:'Andre P.',   c:'#22C55E'},
  {nick:'Sef',   name:'Yousef K.',  c:'#EAB308'},
  {nick:'Tomas', name:'Tomas R.',   c:'#A855F7'},
  {nick:'Leo',   name:'Leo M.',     c:'#EF4444'},
  {nick:'Kenji', name:'Kenji S.',   c:'#06B6D4'},
  {nick:'Pablo', name:'Pablo G.',   c:'#F97316'},
];
const av = (p,cls='')=>`<div class="avatar ${cls}" style="background:${p.c}">${p.nick.slice(0,2).toUpperCase()}</div>`;

/* icons */
const I = {
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  roster:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 6a3 3 0 0 1 0 6M18 19a5 5 0 0 0-3-4.6"/></svg>',
  ball:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9.2"/><path d="M3 12h18M12 3v18M5.5 5.5C8 9 8 15 5.5 18.5M18.5 5.5C16 9 16 15 18.5 18.5"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2c.5 3-1.5 4.5-3 6.5C8.2 10.7 7 12.6 7 15a5 5 0 0 0 10 0c0-2-1-3.6-2-5 .3 1.2-.2 2.2-1 2.6.6-2.4-.4-5.2-1-6.6C12.6 4.5 13 3 13 2Z"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M9 17h6M12 17v3M9 20h6"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
};

/* ============================================================= *
 *  Screen builders
 * ============================================================= */
const S = {};

/* ---- Style guide ---- */
S.style = ()=>`
<div class="scroll stagger">
  <div class="topbar"><span class="ttl">Style Guide</span></div>
  <p class="eyebrow">Palette</p>
  <div class="grid2" style="gap:8px;margin-bottom:6px">
    <div class="swatch" style="background:var(--court);border:1px solid var(--line)">court / bg</div>
    <div class="swatch" style="background:var(--panel);border:1px solid var(--line)">panel</div>
    <div class="swatch" style="background:var(--orange);color:#0c0c0c">orange · primary</div>
    <div class="swatch" style="background:var(--blue);color:#fff">blue · Team A</div>
    <div class="swatch" style="background:var(--red);color:#fff">red · Team B</div>
    <div class="swatch" style="background:var(--green);color:#06210f">green ✓</div>
    <div class="swatch" style="background:var(--yellow);color:#3a2c00">yellow ~</div>
    <div class="swatch" style="background:var(--redz);color:#fff">red ✗</div>
  </div>
  <p style="font-size:11px;color:var(--faint);margin:2px 0 18px">Theme color <span class="mono">#0E131C</span> · accent <span class="mono">#FF5A1F</span>. Maps to <span class="mono">tailwind.config.ts</span> tokens.</p>

  <p class="eyebrow">Type</p>
  <div class="card" style="margin-bottom:18px">
    <div class="typespec"><small>Display · Anton</small><div class="num" style="font-size:34px;line-height:1.05">SCOREBOARD 88</div></div>
    <div class="typespec"><small>Heading · Archivo Expanded 800</small><div style="font-family:'Archivo Expanded';font-weight:800;font-size:18px;text-transform:uppercase">New Match</div></div>
    <div class="typespec" style="border:0"><small>Body · Archivo</small><div style="font-size:14px;color:var(--dim)">On winning side in 4 of 5 games tonight.</div></div>
  </div>

  <p class="eyebrow">Core components</p>
  <button class="btn primary" style="margin-bottom:10px">${I.ball} New Match</button>
  <button class="btn ghost" style="margin-bottom:14px">Re-shuffle Teams</button>
  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    <span class="chip on">3v3</span><span class="chip">4v4</span><span class="chip">5v5</span>
    <span class="chip">${players[0].nick}</span><span class="chip">${players[1].nick}</span>
  </div>
  <div class="stat"><div class="row"><span class="lab">FT%</span><span class="goal">Goal 75% ✓</span></div>
    <div class="track"><div class="fill g" style="width:82%"></div><span class="goaltick" style="left:75%"></span></div></div>
  <p style="font-size:11px;color:var(--faint);margin-top:18px;line-height:1.5">Tap targets ≥ 44px · one-handed reach · every screen has an explicit ← back (no browser chrome in standalone PWA).</p>
</div>`;

/* ---- Dashboard idle ---- */
S.idle = ()=>`
<div class="scroll" style="display:flex;flex-direction:column">
  <div class="topbar">
    <button class="iconbtn" onclick="go('players')">${I.roster}</button>

/* ---- Calendar ---- */
S.calendar = ()=>{
  const dow=['M','T','W','T','F','S','S'];
  const sessions=[4,6,11,13,18,20,25,27,30]; const today=13; const sel=13;
  let cells='';
  for(let i=0;i<3;i++)cells+=`<div class="day out">${28+i}</div>`;
  for(let d=1;d<=31;d++){
    const cls=['day']; if(d===today)cls.push('today'); if(d===sel)cls.push('sel');
    cells+=`<div class="${cls.join(' ')}">${d}${sessions.includes(d)?'<span class="dot"></span>':''}</div>`;
  }
  return `
  <div class="scroll stagger">
    <button class="back" onclick="go('idle')">${I.back} Dashboard</button>
    <div class="topbar" style="margin-top:14px"><span class="ttl">June 2026</span><button class="iconbtn">${I.plus}</button></div>
    <div class="cal" style="margin-bottom:18px">
      ${dow.map(d=>`<div class="dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <p class="eyebrow">Sat 13 June · 2 sessions</p>
    <div class="card" style="margin-bottom:10px;display:flex;align-items:center;gap:12px">
      <div class="feeditem" style="margin:0;padding:0;border:0;flex:1"><div class="ico" style="background:var(--orange-soft);color:var(--orange-2)">${I.clock}</div><div><div class="t">Morning · Levallois Gym</div><div class="s">9:00 · 6 expected</div></div></div>

    <div class="card" style="margin-bottom:16px;display:flex;align-items:center;gap:12px">
      <div class="feeditem" style="margin:0;padding:0;border:0;flex:1"><div class="ico" style="background:var(--blue-soft);color:var(--blue)">${I.clock}</div><div><div class="t">Afternoon · Courbevoie</div><div class="s">15:00 · 8 expected</div></div></div>

};

/* ============================================================= *
 *  Shot chart overlay (the signature screen)
 * ============================================================= */
const SC = {cx:250,cy:392,R1:36.8,R2:126.5,R3:218.5,Rbig:440,
  court:{l:20,r:480,top:8,base:440}, lane:{l:176.4,r:323.6,top:265.5},
  ftc:{x:250,y:265.5,r:55.2}, corner:{lx:47.6,rx:452.4,meetA:22.13}, bb:{y:403.2,l:222.4,r:277.6}};
const polar=(deg,r)=>{const a=deg*Math.PI/180;return [SC.cx+r*Math.cos(a),SC.cy-r*Math.sin(a)];};
function arcPts(a0,a1,r,n=16){const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push(polar(a,r));}return p;}
function poly(pts){return 'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L')+' Z';}
function sector(a0,a1,rIn,rOut){return poly(arcPts(a0,a1,rIn).concat(arcPts(a1,a0,rOut)));}
function halfDisk(r){return poly(arcPts(0,180,r,28));}

// zone defs: id, type, path, label point, makes, attempts
function buildZones(){
  const Z=[];
  Z.push({id:'restricted',type:'paint',d:halfDisk(SC.R1),L:polar(90,SC.R1*0.5),m:38,a:46});
  // interior 4 split: 0-45 rblock, 45-90 rpost, 90-135 lpost, 135-180 lblock
  const int=[[0,45,'paint',31,40,'rblk'],[45,90,'mid',9,22,'rpost'],[90,135,'mid',7,19,'lpost'],[135,180,'paint',27,38,'lblk']];
  int.forEach(([a0,a1,t,m,a,id])=>Z.push({id,type:t,d:sector(a0,a1,SC.R1,SC.R2),L:polar((a0+a1)/2,(SC.R1+SC.R2)/2),m,a}));
  // mid-range 5
  const bins=[0,36,72,108,144,180];
  const midD=[[12,30,'mr0r'],[8,21,'mr45r'],[14,28,'mrtop'],[10,24,'mr45l'],[7,26,'mr0l']];
  for(let i=0;i<5;i++){Z.push({id:midD[i][2],type:'mid',d:sector(bins[i],bins[i+1],SC.R2,SC.R3),L:polar((bins[i]+bins[i+1])/2,(SC.R2+SC.R3)/2),m:midD[i][0],a:midD[i][1]});}
  // three 5 (clipped)
  const thrD=[[18,38,'t0r'],[11,40,'t45r'],[16,34,'ttop'],[12,37,'t45l'],[5,18,'t0l']];
  for(let i=0;i<5;i++){
    const mid=(bins[i]+bins[i+1])/2; let L=polar(mid,SC.R3+34);
    L=[Math.max(34,Math.min(466,L[0])),Math.max(20,L[1])];
    Z.push({id:thrD[i][2],type:'three',d:sector(bins[i],bins[i+1],SC.R3,SC.Rbig),L,m:thrD[i][0],a:thrD[i][1],three:true});
  }
  return Z;
}
function zoneColor(m,a,t){
  if(a===0)return 'rgba(156,163,175,0.2)';
  const p=m/a;
  const [g,y]= t==='three'?[0.30,0.11]: t==='mid'?[0.50,0.26]: t==='ft'?[0.75,0.51]:[0.80,0.51];
  const rgb=p>=g?'34,197,94':p>=y?'234,179,8':'239,68,68';
  return `rgba(${rgb},0.5)`;
}
const ZONES=buildZones();

function courtLines(){
  // all stroked, NO fill, drawn LAST → always on top
  const C='rgba(244,246,252,0.92)'; const sw=2.3;
  let s=`<g fill="none" stroke="${C}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">`;
  // boundary: sidelines + baseline + halfcourt
  s+=`<path d="M${SC.court.l},${SC.court.top} L${SC.court.l},${SC.court.base} L${SC.court.r},${SC.court.base} L${SC.court.r},${SC.court.top} Z"/>`;
  // lane
  s+=`<rect x="${SC.lane.l}" y="${SC.lane.top}" width="${(SC.lane.r-SC.lane.l).toFixed(1)}" height="${(SC.court.base-SC.lane.top).toFixed(1)}"/>`;
  // ft circle
  s+=`<circle cx="${SC.ftc.x}" cy="${SC.ftc.y}" r="${SC.ftc.r}"/>`;
  // restricted arc (semicircle around hoop)
  s+=`<path d="${'M'+arcPts(0,180,SC.R1,26).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L')}"/>`;
  // 3pt line: corner segments + arc
  s+=`<path d="M${SC.corner.lx},${SC.court.base} L${polar(180-SC.corner.meetA,SC.R3)[0].toFixed(1)},${polar(180-SC.corner.meetA,SC.R3)[1].toFixed(1)}"/>`;
  s+=`<path d="M${SC.corner.rx},${SC.court.base} L${polar(SC.corner.meetA,SC.R3)[0].toFixed(1)},${polar(SC.corner.meetA,SC.R3)[1].toFixed(1)}"/>`;
  s+=`<path d="${'M'+arcPts(SC.corner.meetA,180-SC.corner.meetA,SC.R3,40).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L')}"/>`;
  // backboard + hoop
  s+=`<line x1="${SC.bb.l}" y1="${SC.bb.y}" x2="${SC.bb.r}" y2="${SC.bb.y}" stroke-width="3"/>`;
  s+=`<circle cx="${SC.cx}" cy="${SC.cy}" r="7" stroke-width="2"/>`;
  s+=`<line x1="${SC.cx}" y1="${SC.bb.y}" x2="${SC.cx}" y2="${(SC.cy-7).toFixed(1)}"/>`;
  s+=`</g>`;
  return s;
}

function activeSet(mode){
  if(mode==='three')return z=>z.type==='three';
  if(mode==='mid')return z=>z.type!=='three';
  if(mode==='ft')return ()=>false;
  return ()=>true;
}
function renderChart(mode){
  const isActive=activeSet(mode);
  // fills (clipped to court so three zones fill corners cleanly)
  let fills='<g clip-path="url(#courtClip)">';
  let labels='';
  ZONES.forEach(z=>{
    const on=isActive(z);
    const col=on?zoneColor(z.m,z.a,z.type):'rgba(156,163,175,0.18)';
    fills+=`<path d="${z.d}" fill="${col}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
    // label chip
    const txt=on?`${z.m}/${z.a}`:'—';
    const pct=on?Math.round(z.m/z.a*100)+'%':'—';
    const tcol=on?'#0c0c0c':'rgba(244,246,252,.45)';
    const chipFill=on?'rgba(255,255,255,.82)':'rgba(20,27,38,.6)';
    labels+=`<g transform="translate(${z.L[0].toFixed(1)},${z.L[1].toFixed(1)})">
      <rect x="-19" y="-13" width="38" height="26" rx="6" fill="${chipFill}"/>
      <text x="0" y="-2" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="10" fill="${tcol}">${txt}</text>
      <text x="0" y="9" text-anchor="middle" font-family="Anton,sans-serif" font-size="10" fill="${on?'#0c0c0c':'rgba(244,246,252,.4)'}">${pct}</text>
    </g>`;
  });
  fills+='</g>';
  // FT marker (active only in ft mode)
  const ftOn=mode==='ft';
  const ftCol=ftOn?zoneColor(41,50,'ft'):'rgba(156,163,175,0.18)';
  const ftMark=`<g transform="translate(${SC.ftc.x},${SC.ftc.y})">
    <circle r="22" fill="${ftCol}" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>
    <rect x="-20" y="-12" width="40" height="24" rx="6" fill="${ftOn?'rgba(255,255,255,.85)':'rgba(20,27,38,.6)'}"/>
    <text x="0" y="-1" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="10" fill="${ftOn?'#0c0c0c':'rgba(244,246,252,.45)'}">${ftOn?'41/50':'FT'}</text>
    <text x="0" y="9" text-anchor="middle" font-family="Anton" font-size="10" fill="${ftOn?'#0c0c0c':'rgba(244,246,252,.4)'}">${ftOn?'82%':'—'}</text>
  </g>`;
  return `<svg viewBox="0 0 500 460" width="100%" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="courtClip"><rect x="${SC.court.l}" y="${SC.court.top}" width="${SC.court.r-SC.court.l}" height="${SC.court.base-SC.court.top}"/></clipPath></defs>
    ${fills}
    ${courtLines()}
    ${labels}
    ${mode==='ft'?ftMark:''}
  </svg>`;
}
let chartMode='three';
function openChart(mode){chartMode=mode||'three';drawChart();document.getElementById('scOverlay').classList.add('active');}
function closeChart(){document.getElementById('scOverlay').classList.remove('active');}
function setMode(m){chartMode=m;drawChart();}
function drawChart(){
  document.getElementById('scStage').innerHTML=renderChart(chartMode);
  ['ft','mid','three'].forEach(m=>document.getElementById('tab-'+m).classList.toggle('on',m===chartMode));
}

const ORDER=[

function go(key){

  closeChart();
  const sc=document.querySelector('#scr-'+key+' .scroll'); if(sc)sc.scrollTop=0;
}

const screensEl=document.getElementById('screens');

ov.innerHTML=`
  <button class="back" onclick="closeChart()">${I.back} JC's profile</button>
  <div style="text-align:center;margin-top:8px"><div class="num" style="font-size:20px">SHOT CHART · JC</div></div>
  <div class="sc-tabs">

    <button id="tab-mid" onclick="setMode('mid')">MID</button>
    <button id="tab-three" onclick="setMode('three')">3PT</button>
  </div>
  <div class="sc-stage" id="scStage"></div>

    <span><i style="background:var(--yellow)"></i>Close</span>

  </div>
  <p style="text-align:center;color:var(--faint);font-size:11px;margin-top:auto">Tap outside or swipe down to dismiss · court lines always sit above the fills</p>`;

/* interactions */
window.incA=n=>{const e=document.getElementById('scoreA');e.textContent=+e.textContent+n;e.animate([{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:200});};
window.incB=n=>{const e=document.getElementById('scoreB');e.textContent=+e.textContent+n;e.animate([{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:200});};
let gMakes=7;
window.drillMakes=n=>{gMakes=Math.max(0,Math.min(10,gMakes+n));document.getElementById('drillM').textContent=gMakes;};
window.rotateHeat=()=>{const t=document.getElementById('drillToast');t.classList.remove('show');void t.offsetWidth;t.classList.add('show');};

let gtRun=false,gtSec=0,gtInt=null;
window.toggleGameTimer=()=>{
  gtRun=!gtRun;
  document.getElementById('gtLabel').textContent=gtRun?'Stop Game':'Start Game';
  if(gtRun){gtInt=setInterval(()=>{gtSec++;const m=String(Math.floor(gtSec/60)).padStart(2,'0'),s=String(gtSec%60).padStart(2,'0');document.getElementById('gameClock').textContent=m+':'+s;},1000);}
  else clearInterval(gtInt);
};

// session clock + status clock tick
let sess=5048;
setInterval(()=>{sess++;const h=Math.floor(sess/3600),m=Math.floor(sess%3600/60),s=sess%60;const el=document.getElementById('sessClock');if(el)el.textContent=`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;},1000);

go('style');
