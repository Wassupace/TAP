services:
  db:
    image: postgres:15-alpine
    platform: linux/arm64/v8      # Apple Silicon
    restart: unless-stopped
    ports:
      - "5433:5432"               # 5432 may be taken by local Postgres
    environment:
      POSTGRES_DB: tap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init.sql:/docker-entrypoint-initdb.d/000_init.sql
      - ./supabase/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./supabase/migrations/002_v54_additions.sql:/docker-entrypoint-initdb.d/002_v54.sql
      - ./supabase/migrations/003_v58_additions.sql:/docker-entrypoint-initdb.d/003_v58.sql
      - ./supabase/migrations/004_phase2_final_fixes.sql:/docker-entrypoint-initdb.d/004_phase2.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tap"]
      interval: 5s
      timeout: 5s
      retries: 10

  rest:
    image: postgrest/postgrest:v12.0.2
    platform: linux/arm64/v8
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/tap
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_POOL: 5
      PGRST_LOG_LEVEL: info

  gateway:
    image: nginx:alpine
    platform: linux/arm64/v8
    restart: unless-stopped
    ports:
      - "54321:54321"
    depends_on:
      - rest
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
